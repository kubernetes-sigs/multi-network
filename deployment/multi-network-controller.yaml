---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: multi-network-controller-cluster-role
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["multinetwork.networking.x-k8s.io"]
  resources: ["podnetworkkinds"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["multinetwork.networking.x-k8s.io"]
  resources: ["podnetworkkinds/status"]
  verbs: ["update"]
- apiGroups: ["authorization.k8s.io"]
  resources: ["selfsubjectrulesreviews"]
  verbs: ["create"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-network-controller-service-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: multi-network-controller-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: multi-network-controller-cluster-role
subjects:
- kind: ServiceAccount
  name: multi-network-controller-service-account
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-network-controller
  labels:
    app: multi-network-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: multi-network-controller
  template:
    metadata:
      labels:
        app: multi-network-controller
    spec:
      serviceAccountName: multi-network-controller-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
      - name: multi-network-controller
        image: ghcr.io/kubernetes-sigs/multi-network-controller:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
        command:
        - ./multi-network-controller
        args:
        - "run"